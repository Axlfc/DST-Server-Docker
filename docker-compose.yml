services:
  dst-master:
    build: .
    container_name: dst-master
    restart: unless-stopped
    ports:
      - "10999:10999/udp"
    env_file: .env
    environment:
      - SHARD_NAME=Master
      - SKIP_UPDATE=false
    volumes:
      - ./dst-data:/data
      - dst-bin:/opt/dst_server

  dst-caves:
    build: .
    container_name: dst-caves
    restart: unless-stopped
    depends_on:
      - dst-master
    ports:
      - "11000:11000/udp"
    env_file: .env
    environment:
      - SHARD_NAME=Caves
      - SKIP_UPDATE=true
    volumes:
      - ./dst-data:/data
      - dst-bin:/opt/dst_server

volumes:
  dst-bin:
