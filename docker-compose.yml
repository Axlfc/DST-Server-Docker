services:
  dst-master:
    image: jamesits/dst-server:latest
    container_name: dst-master
    restart: unless-stopped
    ports:
      - "10999:10999/udp"
      - "12346:12346/udp"
    volumes:
      - ./dst-data:/data
      - dst-steam-master:/opt/dst_server
    environment:
      - CLUSTER_NAME=DoNotStarveTogether
      - CLUSTER_DIR=Cluster_1
      - SHARD_NAME=Master
      - FORCE_UPDATE=true
    deploy:
      resources:
        limits:
          memory: 2G

  dst-caves:
    image: jamesits/dst-server:latest
    container_name: dst-caves
    restart: unless-stopped
    depends_on:
      - dst-master
    ports:
      - "11000:11000/udp"
      - "12347:12347/udp"
    volumes:
      - ./dst-data:/data
      - dst-steam-caves:/opt/dst_server
    environment:
      - CLUSTER_NAME=DoNotStarveTogether
      - CLUSTER_DIR=Cluster_1
      - SHARD_NAME=Caves
      # IMPORTANTE: Saltamos el update para que no choque con el master
      - SKIP_UPDATE=true
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  dst-steam-master:
  dst-steam-caves:
