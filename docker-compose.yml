services:
  dst-master:
    build: .
    image: dst-server:local
    container_name: dst-master
    restart: unless-stopped
    ports:
      - "10999:10999/udp"
      - "12346:12346/udp"
    # No persistent host or named volumes: keep container ephemeral
    environment:
      - CLUSTER_NAME=DoNotStarveTogether
      - CLUSTER_DIR=Cluster_1
      - SHARD_NAME=Master
      - FORCE_UPDATE=true
    deploy:
      resources:
        limits:
          memory: 2G

  dst-caves:
    build: .
    image: dst-server:local
    container_name: dst-caves
    restart: unless-stopped
    depends_on:
      - dst-master
    ports:
      - "11000:11000/udp"
      - "12347:12347/udp"
    # No persistent host or named volumes: keep container ephemeral
    environment:
      - CLUSTER_NAME=DoNotStarveTogether
      - CLUSTER_DIR=Cluster_1
      - SHARD_NAME=Caves
      # IMPORTANTE: Saltamos el update para que no choque con el master
      - SKIP_UPDATE=true
    deploy:
      resources:
        limits:
          memory: 2G

# No persistent volumes defined — the container will start with a clean filesystem
